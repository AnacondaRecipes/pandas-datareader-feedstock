{% set name = "pandas-datareader" %}
{% set version = "0.11.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pandas-datareader/pandas_datareader-0.11.1.tar.gz
  sha256: e1eadb6d2ccaa4b7a876a1c81b6ff0307fa7a08b56f7799862a50207c2e65a05

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - python
    - pip
    - setuptools >=64
    - wheel
    - setuptools-scm >=8,<9
  run:
    - python
    - lxml
    - pandas >=0.23
    - requests >=2.19.0

test:
  imports:
    - pandas_datareader
  requires:
    - pip
    - python
  commands:
    - pip check

about:
  home: https://github.com/pydata/pandas-datareader
  license: BSD-3
  license_file: LICENSE.md
  license_family: BSD
  summary: Up to date remote data access for pandas, works for multiple versions of pandas
  dev_url: https://github.com/pydata/pandas-datareader
  doc_url: https://pandas-datareader.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mariusvniekerk
    - femtotrader
    - jreback
    - davidastephens
    - bashtage
